<canvas id="c"></canvas>
<script type="module">
import { mulberry, clamp, lerp, seg, ss, eio, eo, vnoise, hash, monotone } from '/core/lib.js';

const W = innerWidth, H = innerHeight, K0 = W / 1920;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const TL = await (await fetch('timeline.json')).json();
let DURS = {}; try { DURS = await (await fetch('voice/dur.json')).json(); } catch (e) {}
window.DUR = TL.dur;

const INK = '#4a3b30', INK2 = '#7a6554', PAPER = '#efe3cc';
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (h, a) => { const c = rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const rainI = monotone(TL.rain);

/* ---------- paper ---------- */
function makePaper() {
  const p = document.createElement('canvas'); p.width = W; p.height = H;
  const g = p.getContext('2d'); const R = mulberry(7);
  g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  const lw = 160, lh = Math.round(160 * H / W), n = document.createElement('canvas'); n.width = lw; n.height = lh;
  const ng = n.getContext('2d'), id = ng.createImageData(lw, lh);
  for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
    const v = (vnoise(x * .06 + y * .031) * .5 + vnoise(x * .15 + 40 + y * .09) * .3 + vnoise(x * .4 + 90 + y * .33) * .2) - .5;
    const i = (y * lw + x) * 4; const c = v > 0 ? 255 : 90, a = Math.abs(v) * .07 * 255 * 1.0;
    id.data[i] = c; id.data[i + 1] = c * .96; id.data[i + 2] = c * .85; id.data[i + 3] = a;
  }
  ng.putImageData(id, 0, 0); g.imageSmoothingEnabled = true; g.drawImage(n, 0, 0, W, H);
  for (let i = 0; i < 2600; i++) {
    const x = R() * W, y = R() * H, l = 6 + R() * 22, a = R() * 6.28;
    g.strokeStyle = R() < .5 ? 'rgba(255,250,235,.28)' : 'rgba(120,95,65,.10)'; g.lineWidth = .6 + R() * .6;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + 3, y + Math.sin(a) * l * .5 - 3, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const gid = g.getImageData(0, 0, W, H), d = gid.data;
  for (let i = 0; i < d.length; i += 4) { const nn = (R() - .5) * 9; d[i] += nn; d[i + 1] += nn; d[i + 2] += nn; }
  g.putImageData(gid, 0, 0);
  const vg = g.createRadialGradient(W / 2, H / 2, H * .5, W / 2, H / 2, W * .75);
  vg.addColorStop(0, 'rgba(120,90,50,0)'); vg.addColorStop(1, 'rgba(120,90,50,.13)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return p;
}
const paper = makePaper();

/* ---------- stroke engine ---------- */
const PROF = { brush: t => Math.pow(Math.sin(Math.PI * Math.min(1, t * .92 + .04)), .55), leaf: t => Math.sin(Math.PI * t) + .05, even: t => 1 - Math.pow(t, 6) * .8, tip: t => 1 - t * .9, trunk: t => 1 - t * .5 };
let SEED = 100;
function ribbon(pts, w, prof, col, a, nb = 4) {
  const R = mulberry(SEED++); let L = 0; const cum = [0];
  for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(L); }
  const N = Math.max(6, Math.min(26, Math.ceil(L / 26)));
  const at = u => { const d = u * L; let i = 1; while (i < pts.length - 1 && cum[i] < d) i++; const s = (d - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]); return [lerp(pts[i - 1][0], pts[i][0], s), lerp(pts[i - 1][1], pts[i][1], s)]; };
  const C = [], Lf = [], Rt = [], f = PROF[prof] || PROF.brush, ph = R() * 50;
  for (let k = 0; k < N; k++) {
    const u = k / (N - 1), p = at(u), p2 = at(Math.min(1, u + .02)), p1 = at(Math.max(0, u - .02));
    let tx = p2[0] - p1[0], ty = p2[1] - p1[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const ww = w * f(u) * (1 + .22 * (vnoise(ph + k * .8) * 2 - 1)) / 2;
    C.push(p); Lf.push([p[0] + -ty * ww, p[1] + tx * ww]); Rt.push([p[0] + ty * ww, p[1] - tx * ww]);
  }
  const br = [];
  for (let b = 0; b < nb; b++) {
    const o = (R() - .5) * .8, line = C.map((p, k) => { const m = (Lf[k][0] - Rt[k][0]) * o, n = (Lf[k][1] - Rt[k][1]) * o; return [p[0] + m, p[1] + n]; });
    br.push({ line, dash: [4 + R() * 30, 3 + R() * 18, 2 + R() * 10], e: .55 + R() * .45, lw: 1 + R() * 1.1, a: .3 + R() * .5 });
  }
  return { k: 's', C, Lf, Rt, br, fill: rgba(col, a), bcol: col, N, bb: [Math.min(...Lf.map(p => p[0]), ...Rt.map(p => p[0])), Math.min(...Lf.map(p => p[1]), ...Rt.map(p => p[1])), Math.max(...Lf.map(p => p[0]), ...Rt.map(p => p[0])), Math.max(...Lf.map(p => p[1]), ...Rt.map(p => p[1]))] };
}
function wash(poly, col, a, dir = 'x') {
  const R = mulberry(SEED++), passes = [];
  for (let i = 0; i < 3; i++) passes.push(poly.map(p => [p[0] + (R() - .5) * 14, p[1] + (R() - .5) * 14]));
  const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
  return { k: 'w', passes, fill: rgba(col, a / 2.2), dir, bb: [Math.min(...xs) - 8, Math.min(...ys) - 8, Math.max(...xs) + 8, Math.max(...ys) + 8] };
}
function drawS(g, s, q) {
  if (q <= 0) return;
  const f = clamp(q) * (s.N - 1), m = Math.floor(f), fr = f - m;
  const tip = i => { const j = Math.min(i, s.N - 1); return j; };
  const part = (A) => { const out = A.slice(0, m + 1); if (m < s.N - 1) { const a = A[m], b = A[m + 1]; out.push([lerp(a[0], b[0], fr), lerp(a[1], b[1], fr)]); } return out; };
  const l = part(s.Lf), r = part(s.Rt); if (l.length < 2) return;
  g.fillStyle = s.fill; g.beginPath(); g.moveTo(l[0][0], l[0][1]);
  for (let i = 1; i < l.length; i++) g.lineTo(l[i][0], l[i][1]);
  for (let i = r.length - 1; i >= 0; i--) g.lineTo(r[i][0], r[i][1]);
  g.closePath(); g.fill();
  for (const b of s.br) {
    const qq = Math.min(f / (s.N - 1), b.e); const ff = qq * (s.N - 1), mm = Math.floor(ff); if (mm < 1) continue;
    g.setLineDash(b.dash); g.lineWidth = b.lw; g.strokeStyle = rgba(s.bcol, b.a);
    g.beginPath(); g.moveTo(b.line[0][0], b.line[0][1]); for (let i = 1; i <= mm; i++) g.lineTo(b.line[i][0], b.line[i][1]); g.stroke();
  }
  g.setLineDash([]);
}
function drawW(g, w, q) {
  if (q <= 0) return; g.save();
  if (q < 1) {
    const [x0, y0, x1, y1] = w.bb; g.beginPath();
    if (w.dir === 'x') { const ex = lerp(x0, x1 + 30, q); g.moveTo(x0, y0); g.lineTo(ex, y0); for (let i = 0; i <= 12; i++) g.lineTo(ex + Math.sin(i * 1.7) * 14, lerp(y0, y1, i / 12)); g.lineTo(x0, y1); }
    else { const ey = lerp(y0, y1 + 30, q); g.moveTo(x0, y0); g.lineTo(x1, y0); for (let i = 0; i <= 12; i++) g.lineTo(lerp(x1, x0, i / 12), ey + Math.sin(i * 1.9) * 12); }
    g.closePath(); g.clip();
  }
  g.fillStyle = w.fill;
  for (const p of w.passes) { g.beginPath(); g.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) g.lineTo(p[i][0], p[i][1]); g.closePath(); g.fill(); }
  g.restore();
}
function drawItems(g, o, q) {
  const n = o.items.length;
  for (let i = 0; i < n; i++) { const it = o.items[i], lo = (i / n) * .62, qi = seg(q, lo, lo + .38); if (it.k === 's') drawS(g, it, qi); else drawW(g, it, o.washQ ? seg(q, 0, .6 + 0 * lo) : qi); }
}
const OBJ = []; const EVB = [];
function obj(layer, t0, t1, items, o = {}) {
  const bb = [1e9, 1e9, -1e9, -1e9]; for (const it of items) { bb[0] = Math.min(bb[0], it.bb[0]); bb[1] = Math.min(bb[1], it.bb[1]); bb[2] = Math.max(bb[2], it.bb[2]); bb[3] = Math.max(bb[3], it.bb[3]); }
  const ob = { layer, t0, t1, items, bb, spr: null, washQ: !!o.washQ, pan: o.pan }; OBJ.push(ob); EVB.push({ t: t0, dur: t1 - t0, type: 'brush', pan: clamp(((bb[0] + bb[2]) / 2 - 1650) / 1650, -1, 1) * .6, vol: o.vol || 1 }); return ob;
}

/* ---------- world ---------- */
const C0 = 1500, R0 = 335;
const PARA = { far: .45, mid: .65, near: .82, 1: 1 };
const rnd = mulberry(2026);
const PATH = [[250, 1500], [700, 1540], [1200, 1610], [1650, 1690], [2100, 1780], [2565, 1870]];
const pathY = x => { let i = 1; while (i < PATH.length - 1 && PATH[i][0] < x) i++; const a = PATH[i - 1], b = PATH[i]; return lerp(a[1], b[1], clamp((x - a[0]) / (b[0] - a[0]), -.2, 1.2)); };
const PLEN = [0]; for (let i = 1; i < PATH.length; i++) PLEN.push(PLEN[i - 1] + Math.hypot(PATH[i][0] - PATH[i - 1][0], PATH[i][1] - PATH[i - 1][1]));
const pathAt = s => { s = clamp(s, 0, PLEN[PLEN.length - 1]); let i = 1; while (i < PATH.length - 1 && PLEN[i] < s) i++; const u = (s - PLEN[i - 1]) / (PLEN[i] - PLEN[i - 1]); return [lerp(PATH[i - 1][0], PATH[i][0], u), lerp(PATH[i - 1][1], PATH[i][1], u)]; };

// bloom + cloud + ridges (far layers)
const CL = [['#8d9db0', .30], ['#a9b6c4', .32], ['#6f8197', .26], ['#b7c2cc', .34]];
const cloud = [];
for (let i = 0; i < 22; i++) { const y = 150 + rnd() * 520, x = 650 + rnd() * 700, L = 500 + rnd() * 900, c = CL[i % 4]; cloud.push(ribbon([[x, y], [x + L * .5, y + (rnd() - .5) * 60], [x + L, y + (rnd() - .5) * 40]], 70 + rnd() * 90, 'leaf', c[0], c[1], 5)); }
obj('far', 4.3, 9.0, cloud);
function ridge(layer, baseY, amp, col, a, t0, t1, seed) {
  const R = mulberry(seed), top = []; for (let x = -200; x <= 3600; x += 200) top.push([x, baseY - amp * (vnoise(x * .0021 + seed) * 1.3 + .3 * Math.sin(x * .004 + seed))]);
  const poly = [...top, [3600, baseY + 420], [-200, baseY + 420]];
  const its = [wash(poly, col, a, 'x')];
  for (let i = 0; i < 9; i++) { const x = -100 + i * 400 + R() * 120, ty = top.reduce((m, p) => Math.abs(p[0] - x) < Math.abs(m[0] - x) ? p : m)[1]; its.push(ribbon([[x, ty + 10], [x + 160, ty + 40 + R() * 20], [x + 330, ty + 20 + R() * 20]], 40 + R() * 24, 'brush', col, .25, 3)); }
  return obj(layer, t0, t1, its, { washQ: true });
}
ridge('far', 760, 150, '#aebdc9', .55, 5.3, 8.2, 3);
ridge('mid', 880, 170, '#8fa5ac', .5, 6.2, 9.0, 11);
ridge('near', 1010, 190, '#7d9a8e', .5, 7.0, 10.4, 19);

// village
const hill = [[-200, 1180], [600, 1150], [1500, 1220], [2400, 1280], [3500, 1120], [3500, 2060], [-200, 2060]];
obj(1, 9.0, 12.0, [wash(hill, '#b9b27a', .55, 'y'), ...[0, 1, 2, 3].map(i => ribbon([[100, 1330 + i * 110], [1100, 1350 + i * 110 + 30], [2200, 1400 + i * 110 - 10], [3300, 1330 + i * 110]], 70, 'brush', ['#9fae78', '#c4b87c', '#8ca06c', '#b0a870'][i], .3, 5))], { washQ: true });

const HOUSES = [[560, 230, 140, 54, 9.4], [900, 260, 165, 60, 9.9], [1280, 240, 150, 56, 10.4], [1660, 290, 170, 62, 10.9], [2060, 230, 150, 54, 11.4], [2480, 330, 190, 70, 16.6], [2930, 210, 140, 52, 17.2]];
const HS = [];
HOUSES.forEach(([x, w, h, rh, t0], idx) => {
  const yb = pathY(x + w / 2) - 34, top = yb - h - rh, hero = idx === 5, its = [];
  its.push(wash([[x, yb - h], [x + w, yb - h], [x + w, yb], [x, yb]], '#dcc9a2', .5, 'y'));
  its.push(ribbon([[x, yb - h], [x, yb]], 5, 'even', INK, .6, 2), ribbon([[x - 10, yb + 2], [x + w + 12, yb + 2]], 6, 'even', INK, .6, 3));
  const roofPoly = [[x - 20, yb - h], [x + w + 20, yb - h], [x + w - 12, top], [x + 14, top]];
  its.push(wash(roofPoly, '#8a6a52', .62, 'x'));
  for (let i = 0; i < 5; i++) { const yy = top + (i + .5) * rh / 5, ins = 14 * (1 - i / 5); its.push(ribbon([[x + 14 - ins - 4, yy], [x + w / 2, yy + 2], [x + w - 12 + ins + 4, yy]], 11, 'even', '#5e4636', .3, 3)); }
  its.push(ribbon([[x + 6, top], [x + w - 4, top]], 7, 'even', INK, .7, 3), ribbon([[x - 20, yb - h], [x + w + 20, yb - h]], 6, 'even', INK, .75, 3));
  if (!hero) {
    its.push(ribbon([[x + w * .2, yb - h * .55], [x + w * .2, yb]], 28, 'even', '#6b4a38', .7, 4));
    its.push(wash([[x + w * .55, yb - h * .7], [x + w * .8, yb - h * .7], [x + w * .8, yb - h * .35], [x + w * .55, yb - h * .35]], '#9aa7b3', .45, 'y'));
    its.push(ribbon([[x + w * .55, yb - h * .7], [x + w * .8, yb - h * .7], [x + w * .8, yb - h * .35], [x + w * .55, yb - h * .35], [x + w * .55, yb - h * .7]], 4, 'even', INK, .8, 2));
  } else {
    its.push(ribbon([[x + 60, yb - h * .55], [x + 60, yb]], 6, 'even', INK, .6, 2), ribbon([[x + 112, yb - h * .55], [x + 112, yb]], 6, 'even', INK, .6, 2), ribbon([[x + 60, yb - h * .55], [x + 112, yb - h * .55]], 6, 'even', INK, .6, 2));
  }
  const o = obj(1, t0, t0 + 1.7, its); HS.push({ x, w, h, rh, yb, top, roofPoly, o, hero });
});
const HERO = HS[5], door = { x: HERO.x + 60, w: 52, y0: HERO.yb - HERO.h * .55, y1: HERO.yb };
const win = { x: HERO.x + 210, y: HERO.yb - HERO.h * .78, w: 76, h: 64 };
const stairs = [];

// trees
function tree(x, yb, s, pine, t0) {
  const R = mulberry(SEED++), its = [];
  its.push(ribbon([[x, yb], [x + (R() - .5) * 8, yb - 60 * s]], 9 * s, 'trunk', '#5e4636', .7, 2));
  if (pine) { for (let i = 0; i < 4; i++) { const yy = yb - (35 + i * 34) * s, ww = (62 - i * 11) * s; for (let j = 0; j < 3; j++) its.push(ribbon([[x - ww, yy + 24 * s + j * 4], [x, yy - 18 * s + j * 3], [x + ww, yy + 24 * s - j * 3]], 22 * s, 'leaf', ['#3f5f4c', '#4e7058', '#35544a'][j], .38, 3)); } }
  else { for (let i = 0; i < 14; i++) { const a = R() * 6.28, rr = R() * 46 * s, cx = x + Math.cos(a) * rr, cy = yb - 92 * s + Math.sin(a) * rr * .8; its.push(ribbon([[cx - 24 * s, cy], [cx, cy - 6 * s], [cx + 24 * s, cy + 3 * s]], 26 * s, 'leaf', ['#7f9a5a', '#5f7e4a', '#92a866', '#4e6e3c'][i % 4], .36, 3)); } }
  return obj(1, t0, t0 + 1.2, its);
}
[[470, 1410, 1.05, 1, 10.0], [820, 1500, .9, 0, 10.5], [1190, 1560, 1.1, 1, 10.9], [1560, 1610, .95, 0, 11.3], [1980, 1700, 1.15, 1, 11.8], [2390, 1790, 1, 0, 12.2], [2830, 1800, 1.1, 1, 12.6], [3150, 1740, .95, 0, 13.0], [1000, 1390, .7, 1, 12.4], [1760, 1500, .7, 1, 13.2]].forEach(a => tree(a[0], a[1], a[2], a[3], a[4]));

// path + stones
const pathItems = [ribbon(PATH.map(p => [p[0], p[1] + 6]), 60, 'even', '#a79684', .38, 6), ribbon(PATH.map(p => [p[0], p[1] - 14]), 22, 'even', '#8a7a6a', .3, 4)];
{ const R = mulberry(5); for (let i = 0; i < 46; i++) { const s = R() * PLEN[PLEN.length - 1], p = pathAt(s); pathItems.push(ribbon([[p[0] - 12, p[1] + (R() - .5) * 26], [p[0] + 12, p[1] + (R() - .5) * 26]], 7 + R() * 5, 'leaf', '#6d5d50', .35, 1)); } }
obj(1, 12.0, 14.8, pathItems);

// stream + bank
const sy = 1995;
const streamPoly = [[-200, sy], [900, sy + 30], [1700, sy + 8], [2600, sy + 40], [3500, sy + 10], [3500, sy + 190], [2600, sy + 220], [1700, sy + 190], [900, sy + 215], [-200, sy + 180]];
const sItems = [wash(streamPoly, '#7fa0b8', .55, 'x')]; for (let i = 0; i < 12; i++) sItems.push(ribbon([[-100 + i * 280, sy + 60 + (i % 4) * 30], [100 + i * 280, sy + 55 + (i % 4) * 30], [300 + i * 280, sy + 66 + (i % 4) * 30]], 12, 'tip', '#f0e6d0', .6, 2));
obj(1, 13.0, 15.5, sItems, { washQ: true, vol: .7 });
obj(1, 14.0, 16.0, [wash([[-200, sy + 190], [3500, sy + 200], [3500, sy + 520], [-200, sy + 520]], '#6e7f56', .5, 'x'), ...[0, 1, 2, 3, 4, 5].map(i => ribbon([[-100 + i * 600, sy + 260 + (i % 2) * 40], [200 + i * 600, sy + 280], [500 + i * 600, sy + 270]], 80, 'brush', '#4e6e3c', .3, 4))], { washQ: true });

/* ---------- camera ---------- */
const wx = win.x + win.w / 2, wy = win.y + win.h / 2;
const camK = [[0, 1500, 335, 520], [3.6, 1500, 335, 520], [5.8, 1400, 580, 1920], [9, 1500, 790, 1920], [15, 1500, 1420, 1920], [18.5, 1900, 1620, 1920], [21.5, 1900, 1620, 1920], [26.2, 2600, 1700, 1380], [28.7, wx, wy, 420], [30, wx, wy, 400]];
const cxF = monotone(camK.map(k => [k[0], k[1]])), cyF = monotone(camK.map(k => [k[0], k[2]])), cwF = monotone(camK.map(k => [k[0], Math.log(k[3])]));
const cam = t => ({ x: cxF(t), y: cyF(t), vw: Math.exp(cwF(t)) });
function setLayer(c, layer) {
  const p = layer === 1 ? 1 : PARA[layer], k = W / c.vw * 1, ex = c.x * p + C0 * (1 - p), ey = c.y * p + R0 * (1 - p);
  ctx.setTransform(k, 0, 0, k, W / 2 - ex * k, H / 2 - ey * k); return { k, ex, ey };
}
const SPR = new Map();
function drawObj(o, t, c, L) {
  const q = seg(t, o.t0, o.t1); if (q <= 0) return;
  const x0 = (o.bb[0] - L.ex) * L.k + W / 2, x1 = (o.bb[2] - L.ex) * L.k + W / 2, y0 = (o.bb[1] - L.ey) * L.k + H / 2, y1 = (o.bb[3] - L.ey) * L.k + H / 2;
  if (x1 < -50 || x0 > W + 50 || y1 < -50 || y0 > H + 50) return;
  if (q >= 1 && L.k < 1.5 * K0) {
    let s = SPR.get(o); const cs = 1.5 * K0;
    if (!s) { const w = Math.ceil((o.bb[2] - o.bb[0]) * cs) + 4, h = Math.ceil((o.bb[3] - o.bb[1]) * cs) + 4; if (w * h > 36e6) { drawItems(ctx, o, 1); return; } const cn = document.createElement('canvas'); cn.width = w; cn.height = h; const g = cn.getContext('2d'); g.setTransform(cs, 0, 0, cs, -o.bb[0] * cs + 2, -o.bb[1] * cs + 2); drawItems(g, o, 1); s = { cn, cs }; SPR.set(o, s); }
    ctx.save(); ctx.drawImage(s.cn, 0, 0, s.cn.width, s.cn.height, o.bb[0] - 2 / s.cs, o.bb[1] - 2 / s.cs, s.cn.width / s.cs, s.cn.height / s.cs); ctx.restore(); return;
  }
  drawItems(ctx, o, q);
}

/* ---------- dynamic things ---------- */
function bloom(t) {
  // blue pigment drop on the sheet at world (1500,335); stays as the heart of the cloud
  const bx = 1500, by = 335, lt = TL.sfx.splat; let k = 0;
